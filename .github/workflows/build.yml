name: Build APKs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build debug APK
        working-directory: kotlin
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-apk
          path: kotlin/app/build/outputs/apk/debug/app-debug.apk

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Generate android platform + build
        working-directory: dart
        run: |
          flutter create . --platforms=android --project-name sonic_physics_dart
          flutter pub get
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: dart-apk
          path: dart/build/app/outputs/flutter-apk/app-debug.apk

  release:
    needs: [kotlin, dart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - run: |
          mv out/kotlin-apk/app-debug.apk sonic-kotlin.apk
          mv out/dart-apk/app-debug.apk sonic-dart.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            sonic-kotlin.apk
            sonic-dart.apk
